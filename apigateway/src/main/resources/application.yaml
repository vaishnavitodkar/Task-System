spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: task-service
          uri: lb://TASKSERVICE
          predicates:
            - Path=/tasks/**

        - id: worker-service
          uri: lb://WORKER-SERVICE
          predicates:
            - Path=/worker/**

management:
  endpoints:
    web:
      exposure:
        include: "*"

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/